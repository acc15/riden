[project]
name = "riden"
version = "0.2.0"
description = "Synchronous Python client for Riden RD60xx power supplies (USB serial and Bluetooth)"
readme = "README.md"
authors = [
    { name = "Vyacheslav Mayorov", email = "vyacheslav.mayorov@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = [
    "riden",
    "rd6006",
    "rd6012",
    "rd6018",
    "rk6006",
    "rk6012",
    "rk6018",
    "power-supply",
    "modbus",
    "bluetooth",
    "serial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "minimalmodbus>=2.1.1",
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/acc15/riden"
Repository = "https://github.com/acc15/riden"
Issues = "https://github.com/acc15/riden/issues"

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
pre_commit_hooks = [
    "just check",
    "uv lock",
    "git add uv.lock",
    "uv build --clear",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
